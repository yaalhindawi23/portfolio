<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me | Yaman Al-Hindawi</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <a class="brand" href="index.html">My Portfolio</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a class="active" href="contact.html">Contact Me</a>
      </div>
    </nav>
  </header>

  <main class="contact-main">
    <section class="contact-intro">
      <h1>Contact Me</h1>
      <p>Have a question, idea, or opportunity? Send me a message using the form below.</p>
    </section>

    <form id="contactForm" class="contact-form" novalidate>
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">
        <small class="error" id="nameError"></small>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="name@example.com">
        <small class="error" id="emailError"></small>
      </div>
      <div class="form-group">
        <label for="country">Country</label>
        <input type="text" id="country" name="country" placeholder="Enter your country">
        <small class="error" id="countryError"></small>
      </div>
      <div class="form-group">
        <label for="comments">Comments</label>
        <textarea id="comments" name="comments" rows="5" placeholder="Write your message here"></textarea>
        <small class="error" id="commentsError"></small>
      </div>
      <button class="button submit-button" type="submit">Submit</button>
      <p class="form-note">All fields are required.</p>
    </form>
  </main>

  <footer><p>© 2026 Yaman Al-Hindawi · Jordan University of Science and Technology</p></footer>
</body>
</html>
